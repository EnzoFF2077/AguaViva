<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Registro de alertas sobre a qualidade da água.">

  <!-- Começa a baixar o bundle enquanto o navegador ainda processa o HTML. -->
  <link rel="preload" href="main.dart.js" as="script" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ÁguaViva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ÁguaViva</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status" aria-live="polite" style="position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f4fafb;color:#17454e;font:18px system-ui">
    <strong>ÁguaViva</strong>
    <p id="startup-message">Abrindo o aplicativo…</p>
    <button id="startup-retry" hidden>Recarregar</button>
  </div>
  <script>
    const startup = document.getElementById('startup');
    const message = document.getElementById('startup-message');
    const retry = document.getElementById('startup-retry');
    retry.onclick = () => location.reload();
    window.showStartupError = (error) => {
      console.error(error);
      message.textContent = 'Não foi possível carregar o aplicativo. Verifique a conexão.';
      retry.hidden = false;
    };
    // Orçamento visível de 3 s: o texto muda antes do limite e a ação de
    // recarregar fica disponível ao longo de todo o carregamento lento.
    const timers = [
      setTimeout(() => { message.textContent = 'Carregando os alertas da sua região…'; }, 1000),
      setTimeout(() => {
        message.textContent = 'A conexão está lenta. Se nada acontecer, recarregue a página.';
        retry.hidden = false;
      }, 2000),
      setTimeout(() => {
        message.textContent = 'O carregamento passou de 3 segundos. Verifique a conexão e recarregue.';
        retry.hidden = false;
      }, 3000),
    ];
    window.addEventListener('flutter-first-frame', () => {
      timers.forEach(clearTimeout);
      startup.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async onerror="showStartupError(event)"></script>
</body>
</html>
